<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome to Student Login Page</title>
	<link rel="stylesheet" href="s_login.css">
	<link rel="icon" sizes="70x70" href="../image-sources/logo-fold/web-logo.png" type="image/png">
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
	<div class="container">
		<div id="st-img">
			<img src="../image-sources/logo-fold/ST.png">
		</div>
		<h2>Let's login</h2>
		<form id="loginForm">
			<div class="form-group">
				<input type="text" id="roll" name="roll" placeholder="Enter roll number" required>
			</div>
			<div class="form-group password-wrap">
				<input type="password" id="password" name="password" placeholder="Password" required>
				<button type="button" id="togglePw" class="toggle" aria-label="Show password"><svg viewBox="0 0 24 24"
						fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
						<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
						<circle cx="12" cy="12" r="3" />
						<line class="slash" x1="1" y1="1" x2="23" y2="23" />
					</svg></button>
			</div>

			<div class="btn-row">
				<button type="submit" class="btn">Login</button>
				<a href="../index.html" class="btn home-btn" aria-label="Back to main page" title="Back to main page"><i
						class="fas fa-home"></i></a>
			</div>
		</form>
		<div id="message" class="message"></div>
	</div>
	<script src="s_login.js"></script>
</body>

</html>
