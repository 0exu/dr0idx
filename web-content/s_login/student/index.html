<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dashboard</title>
	<script>
		if (sessionStorage.getItem('student_auth') !== '1') window.location.replace('../s_login.html');
	</script>
	<link rel="icon" sizes="70x70" href="../../image-sources/logo-fold/web-logo.png" type="image/png">
	<link rel="stylesheet" href="style.css">
	<link
		href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Roboto+Mono:wght@400;700&display=swap"
		rel="stylesheet" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
	<nav class="side-bar">
		<a href="#home" class="nav-link active" data-page="home"><i class="fas fa-home"></i> </a>
		<div class="sidebar-mid">
			<a href="#study-materials" class="nav-link" data-page="study-materials"><i class="fas fa-graduation-cap"></i> </a>
			<a href="#academics" class="nav-link" data-page="academics"><i class="fas fa-pencil-alt"></i> </a>
			<a href="#attendence" class="nav-link" data-page="attendence"><i class="fas fa-clipboard-list"></i> </a>
			<a href="#notices" class="nav-link" data-page="notices"><i class="fas fa-bell"></i> </a>
		</div>
		<a href="#" id="logoutBtn" aria-label="Sign out"><i class="fas fa-arrow-right-from-bracket"></i>
		</a>
	</nav>
	<main class="container">
		<section class="page active" id="home" aria-label="Home">
			<div class="row1">
				<div class="sub-folder" id="s-material" data-goto="study-materials" role="button" tabindex="0">
					<p>Study materials</p>
					<strong class="tile-value" id="tile-materials">-</strong>
					<span class="tile-label">new this week</span>
				</div>
				<div class="sub-folder" id="attendence-div" data-goto="attendence" role="button" tabindex="0">
					<p>Attendence</p>
					<strong class="tile-value" id="tile-attendance">-</strong>
					<span class="tile-label">present (30 days)</span>
				</div>
			</div>
			<div class="row2">
				<div class="sub-folder" id="academics-div" data-goto="academics" role="button" tabindex="0">
					<p>Academics</p>
					<strong class="tile-value" id="tile-academics">-</strong>
					<span class="tile-label">average score</span>
				</div>
				<div class="sub-folder" id="notice-div" data-goto="notices" role="button" tabindex="0">
					<p>Notices</p>
					<strong class="tile-value" id="tile-notices">-</strong>
					<span class="tile-label">recent</span>
				</div>
			</div>
			<p class="tile-foot" id="tile-courses">-</p>
		</section>
		<section class="page" id="study-materials" aria-label="Study Materials">
			<div class="containers">
				<h2>Study materials</h2>
				<div id="materials-list" class="data-list">
					<p class="loading">Loading...</p>
				</div>
			</div>
		</section>
		<section class="page" id="academics" aria-label="Academics">
			<div class="containers">
				<h2>Academics</h2>
				<div id="academics-list" class="data-list">
					<p class="loading">Loading...</p>
				</div>
			</div>
		</section>
		<section class="page" id="attendence" aria-label="Attendence">
			<div class="containers">
				<h2>Attendence</h2>
				<div id="attendance-list" class="data-list">
					<p class="loading">Loading...</p>
				</div>
			</div>
		</section>
		<section class="page" id="notices" aria-label="Notices">
			<div class="containers">
				<h2>Notices</h2>
				<div id="notices-list" class="data-list">
					<p class="loading">Loading...</p>
				</div>
			</div>
		</section>
	</main>
	<script src="script.js"></script>
</body>

</html>
