<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Welcome to Teacher Login Page</title>
	<link rel="stylesheet" href="t_login.css">
</head>

<body>
	<div class="container">
		<h2>Teacher Login</h2>
		<form id="loginForm">
			<div class="form-group">
				<input type="text" id="tid" name="tid" placeholder="Enter teacher ID" required>
			</div>
			<div class="form-group password-wrap">
				<input type="password" id="password" name="password" placeholder="Password" required>
				<button type="button" id="togglePw" class="toggle" aria-label="Show password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" /><circle cx="12" cy="12" r="3" /><line class="slash" x1="1" y1="1" x2="23" y2="23" /></svg></button>
			</div>

			<button type="submit" class="btn">Login</button>
		</form>
		<div id="message" class="message"></div>
	</div>
	<script src="t_login.js"></script>
</body>

</html>
